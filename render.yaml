# Выкладка на Render.com: New -> Blueprint -> выбрать репозиторий. Платформа сама прочитает этот файл.
# Сейчас настроен БЕСПЛАТНЫЙ вариант для показа клиенту.
# Заказы на бесплатном плане не сохраняются после перезапуска. Для боевой работы:
#   1) поставьте plan: starter
#   2) раскомментируйте блок disk ниже
services:
  - type: web
    name: drinkstar-demo
    runtime: docker
    plan: free
    # disk:
    #   name: orders
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: STAFF_PIN
        sync: false          # введите свой PIN для бариста в панели Render (не 1234)
      - key: ADMIN_PIN
        sync: false          # введите свой PIN для владельца (не 0000 и не такой же, как STAFF_PIN)
      - key: PAYMENT_PROVIDER
        value: mock          # демо-оплата. На боевом: имя провайдера, например kaspi, или none
      - key: SMS_PROVIDER
        value: demo          # демо: код входа показывается на странице. На боевом: имя провайдера
      - key: BASE_URL
        sync: false          # адрес сайта, который выдаст Render, потом ваш домен (можно оставить пустым)
