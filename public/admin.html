<!doctype html>
<html lang="ru" data-title="ad.tab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Аналитика — DrinkStar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;600;700;800&family=Noto+Sans:wght@500;600;700;800&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
html:not([lang="en"]){--serif:'Noto Serif',Georgia,serif;--sans:'Noto Sans',system-ui,sans-serif}
:root{--cream:#f7efe1;--cream-2:#efe3cf;--paper:#fffaf1;--espresso:#3a2a1e;--brown:#5b4128;--caramel:#b9772f;--caramel-2:#d9a05b;--muted:#8a7560;--line:#e3d3ba;--green:#40691f;--red:#9a4a22}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--sans);background:var(--cream);color:var(--espresso);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px max(22px,env(safe-area-inset-right)) 14px max(22px,env(safe-area-inset-left));padding-top:max(14px,env(safe-area-inset-top));background:var(--espresso);color:var(--cream);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-family:var(--serif);font-size:1.3rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.top select,.top button,.top a.go{font:inherit;font-weight:700;font-size:16px;padding:9px 14px;border-radius:10px;border:none;cursor:pointer;background:#4a3524;color:var(--cream);text-decoration:none;min-height:42px;display:inline-flex;align-items:center;gap:7px}
.top select{-webkit-appearance:none;appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--cream) 50%),linear-gradient(135deg,var(--cream) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.top a.go{background:var(--caramel-2);color:var(--espresso)}
.lang{display:inline-flex;border:1.5px solid #6a523c;border-radius:999px;overflow:hidden}
.top .lang button{border:none;background:none;font:inherit;font-weight:800;font-size:.75rem;padding:8px 11px;color:#cdb99d;cursor:pointer;min-height:0;border-radius:0}
.top .lang button.on{background:var(--cream);color:var(--espresso)}
.tabs{display:flex;gap:6px;background:var(--espresso);padding:0 max(22px,env(safe-area-inset-left)) 12px;position:sticky;top:0;z-index:4;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:800;font-size:.9rem;padding:10px 18px;border-radius:999px;border:1.5px solid #6a523c;background:none;color:#cdb99d;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tabs button.on{background:var(--cream);color:var(--espresso);border-color:var(--cream)}
main{max-width:1100px;margin:0 auto;padding:22px max(22px,env(safe-area-inset-right)) 40px max(22px,env(safe-area-inset-left))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.kpi span{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:var(--serif);font-size:1.9rem;margin-top:4px;line-height:1.1}
.kpi small{color:var(--muted);font-size:.78rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h2{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--caramel);margin-bottom:14px}
.card.wide{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px}
.bars div{flex:1;background:var(--caramel-2);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--caramel)}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--espresso);color:var(--cream);font-size:.7rem;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;margin-bottom:4px;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:6px;font-weight:600}
.list .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem;font-weight:600}
.list .r:last-child{border:0}
.list .r i{font-style:normal;color:var(--muted);font-weight:500;text-align:right}
.meter{height:10px;background:var(--cream-2);border-radius:99px;overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--caramel)}
.empty{color:var(--muted);font-size:.9rem}
/* сотрудники */
.pinbox{background:#fff3d6;border:1.5px solid #e8c777;color:#7a4a00;border-radius:14px;padding:14px 16px;font-weight:700;margin-bottom:16px;font-size:.95rem}
.pinbox b{font-family:var(--serif);font-size:1.5rem;letter-spacing:.2em}
.addform{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:10px;align-items:end}
.addform label{display:grid;gap:5px;font-size:.78rem;font-weight:700;color:var(--brown)}
.addform input,.addform select{font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);width:100%;color:var(--espresso)}
.btn{font:inherit;font-weight:800;font-size:.9rem;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;background:var(--espresso);color:var(--cream);min-height:44px;display:inline-flex;align-items:center;gap:7px}
.btn.sec{background:var(--cream-2);color:var(--brown)}
.btn.danger{background:#f1dcd0;color:var(--red)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.82rem}
.staff-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.staff-row:last-child{border:0}
.staff-row .nm{font-weight:800;min-width:150px}
.staff-row .meta{flex:1;font-size:.82rem;color:var(--muted);font-weight:600;min-width:200px}
.badge{display:inline-block;font-size:.68rem;font-weight:800;border-radius:6px;padding:2px 8px;letter-spacing:.04em;text-transform:uppercase}
.badge.on{background:#e3efd6;color:var(--green)}.badge.off{background:var(--cream-2);color:var(--muted)}.badge.mgr{background:var(--caramel);color:#fff}.badge.hid{background:#f1dcd0;color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 6px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px dashed var(--line);font-weight:600}
.tw{overflow-x:auto}
/* отзывы */
.rv{padding:16px 0;border-bottom:1px dashed var(--line)}
.rv:last-child{border:0}
.rv-top{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-size:.85rem;font-weight:700}
.rv-top .st{color:var(--caramel-2)}


.rv-top small{color:var(--muted);font-weight:600}
.rv p{margin:8px 0;font-size:.95rem;font-weight:500;line-height:1.5}
.rv textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);min-height:64px;resize:vertical;color:var(--espresso)}
.rv .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;grid-template-columns:minmax(0,1fr);padding:20px}
.login form{background:var(--paper);padding:34px;border-radius:24px;border:1px solid var(--line);display:grid;gap:14px;width:min(340px,92vw);text-align:center;margin:0 auto}
.login .lang{justify-self:center;border-color:var(--line)}
.login .lang button{border:none;background:none;font:inherit;font-weight:800;font-size:.75rem;padding:8px 11px;color:var(--muted);cursor:pointer}
.login .lang button.on{background:var(--espresso);color:var(--cream)}
.login h1{font-family:var(--serif)}
.login input{font-size:1.4rem;text-align:center;letter-spacing:.4em;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);font-family:inherit;width:100%}
.login button.go{padding:14px;border-radius:12px;border:none;background:var(--espresso);color:var(--cream);font-weight:800;font-family:inherit;font-size:1rem;cursor:pointer;min-height:48px}
.login p{color:var(--red);font-size:.85rem;min-height:1.2em;font-weight:600}
@media(max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}.addform{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <div class="lang"></div>
    <h1><span data-ic="star"></span> DrinkStar<br><span data-i18n="ad.login">Аналитика</span></h1>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" autofocus>
    <p id="loginErr"></p>
    <button class="go" data-i18n="st.enter">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <h1><span data-ic="star"></span> <span data-i18n="ad.login">Аналитика</span></h1>
    <div class="lang"></div>
    <span id="statsCtl" style="display:contents">
      <select id="days" aria-label="Period"><option value="1" data-i18n="ad.p1">Сегодня</option><option value="7" selected data-i18n="ad.p7">7 дней</option><option value="30" data-i18n="ad.p30">30 дней</option><option value="90" data-i18n="ad.p90">90 дней</option></select>
      <select id="loc" aria-label="Location"></select>
      <a class="go" id="csv" href="#"><span data-ic="check" hidden></span><span data-i18n="ad.csv">Скачать CSV</span></a>
    </span>
    <button id="out" type="button" data-i18n="st.logout">Выйти</button>
  </div>
  <div class="tabs">
    <button data-view="stats" class="on"><span data-ic="clock"></span> <span data-i18n="ad.tab.stats">Аналитика</span></button>
    <button data-view="staff"><span data-ic="users"></span> <span data-i18n="ad.tab.staff">Сотрудники</span></button>
    <button data-view="reviews"><span data-ic="message-circle"></span> <span data-i18n="ad.tab.reviews">Отзывы</span></button>
  </div>
  <main>
    <div id="view-stats"></div>
    <div id="view-staff" hidden></div>
    <div id="view-reviews" hidden></div>
  </main>
</div>

<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="/admin.js"></script>
</body>
</html>
