<!doctype html>
<html lang="ru" data-title="pm.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Оплата заказа — DrinkStar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
/* ru и kk: весь кириллический текст одним семейством Noto, где есть казахские буквы ә ғ қ ң ө ұ ү һ і */
html:not([lang="en"]){--serif:'Noto Serif',Georgia,serif;--sans:'Noto Sans',system-ui,sans-serif}

:root{--cream:#f7efe1;--paper:#fffaf1;--espresso:#3a2a1e;--brown:#5b4128;--caramel:#b9772f;--muted:#8a7560;--line:#e3d3ba}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--espresso);min-height:100vh;display:grid;place-items:center;grid-template-columns:minmax(0,1fr);padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:32px 28px;width:min(420px,100%);box-shadow:0 20px 60px rgba(91,65,40,.12)}
.demo{display:inline-block;background:#fff3d6;color:#8a5a14;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:16px}
h1{font-family:var(--serif);font-size:1.7rem;margin-bottom:4px}
.sum{font-family:var(--serif);font-size:2.6rem;font-weight:700;margin:6px 0 20px}
.sub{color:var(--muted);font-size:.9rem}
label{display:grid;gap:5px;font-size:.78rem;font-weight:700;color:var(--brown);margin-bottom:12px}
input{width:100%;min-width:0;font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);color:var(--espresso)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
button.pay{width:100%;margin-top:8px;padding:16px;border:none;border-radius:999px;background:var(--espresso);color:var(--cream);font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
button.pay[disabled]{opacity:.6}
.note{margin-top:16px;font-size:.78rem;color:var(--muted);text-align:center}
.err{color:#9a4a22;font-weight:700;font-size:.85rem;margin-top:10px;min-height:1em}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper);float:right}
.lang button{border:none;background:none;font:inherit;font-weight:800;font-size:.7rem;padding:6px 9px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--espresso);color:var(--cream)}
</style>
</head>
<body>
<div class="card">
  <div class="lang"></div>
  <span class="demo" data-i18n="pm.demo">Демо-оплата</span>
  <h1 data-i18n="pm.h1">Оплата заказа</h1>
  <div class="sub" id="where">DrinkStar Coffee&amp;more</div>
  <div class="sum" id="sum">…</div>
  <form id="f">
    <label><span data-i18n="pm.card">Номер карты</span><input value="4111 1111 1111 1111" inputmode="numeric" autocomplete="off"></label>
    <div class="two"><label><span data-i18n="pm.exp">Срок</span><input value="12/30" autocomplete="off"></label><label>CVC<input value="123" autocomplete="off"></label></div>
    <button class="pay" id="btn" data-i18n="pm.pay">Оплатить</button>
    <div class="err" id="err"></div>
  </form>
  <div class="note" data-i18n="pm.note">Это демонстрация. Деньги не списываются. В боевой версии здесь откроется страница банка.</div>
</div>
<script src="i18n.js"></script>
<script>
const { LANG } = window.I18N;
const tk = new URLSearchParams(location.search).get('t');
const fmt = n => n.toLocaleString('ru-RU').replace(/ /g, ' ') + ' ₸';
fetch('/api/orders/' + tk, { headers: { 'x-lang': LANG } }).then(r => r.json()).then(o => {
  if (o.error) throw 0;
  document.getElementById('sum').textContent = fmt(o.payable);
  document.getElementById('where').textContent = t('pm.order', { n: o.number, loc: o.location });
  if (o.paid) location.replace('/track.html?t=' + tk);
}).catch(() => { document.getElementById('err').textContent = t('pm.nf'); document.getElementById('btn').disabled = true; });
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById('btn'); b.disabled = true; b.textContent = t('pm.processing');
  await new Promise(r => setTimeout(r, 1200));
  const r = await fetch('/api/mock-pay/' + tk, { method: 'POST', headers: { 'x-lang': LANG } });
  if (r.ok) location.href = '/track.html?t=' + tk;
  else { document.getElementById('err').textContent = t('pm.fail'); b.disabled = false; b.textContent = t('pm.pay'); }
};
</script>
</body>
</html>
