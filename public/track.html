<!doctype html>
<html lang="ru" data-title="tr.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой заказ — DrinkStar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
/* ru и kk: весь кириллический текст одним семейством Noto, где есть казахские буквы ә ғ қ ң ө ұ ү һ і */
html:not([lang="en"]){--serif:'Noto Serif',Georgia,serif;--sans:'Noto Sans',system-ui,sans-serif}

:root{--cream:#f7efe1;--cream-2:#efe3cf;--paper:#fffaf1;--espresso:#3a2a1e;--brown:#5b4128;--caramel:#b9772f;--caramel-2:#d9a05b;--muted:#8a7560;--line:#e3d3ba}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:radial-gradient(800px 500px at 80% 0,#f0d9b0,transparent 60%),var(--cream);color:var(--espresso);min-height:100vh;display:grid;place-items:center;grid-template-columns:minmax(0,1fr);padding:24px;-webkit-font-smoothing:antialiased}
.card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:36px 32px;width:min(480px,100%);box-shadow:0 20px 60px rgba(91,65,40,.12);text-align:center}
.brand{font-family:var(--serif);font-weight:700;font-size:1.2rem;margin-bottom:22px;display:block;color:var(--espresso);text-decoration:none}
.eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--caramel);font-weight:700}
.num{font-family:var(--serif);font-size:4.5rem;font-weight:700;line-height:1;margin:6px 0 4px}
.where{color:var(--muted);font-size:.9rem}
.status{margin:26px 0 6px;font-family:var(--serif);font-size:1.6rem;font-weight:700}
.hint{color:var(--brown);font-size:.92rem;min-height:2.6em}
.steps{display:flex;justify-content:space-between;margin:26px 0 8px;position:relative}
.steps::before{content:"";position:absolute;left:8%;right:8%;top:15px;height:3px;background:var(--line)}
.step{position:relative;flex:1;font-size:.72rem;font-weight:600;color:var(--muted)}
.dot{width:32px;height:32px;border-radius:50%;background:var(--paper);border:3px solid var(--line);margin:0 auto 8px;display:grid;place-items:center;font-size:.8rem;transition:.4s;position:relative}
.step.done .dot{background:var(--caramel);border-color:var(--caramel);color:#fff}
.step.now .dot{border-color:var(--caramel);box-shadow:0 0 0 6px rgba(185,119,47,.18);animation:pulse 1.6s infinite}
.step.done,.step.now{color:var(--espresso)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(185,119,47,.05)}}
.list{margin-top:26px;text-align:left;border-top:1px dashed var(--line);padding-top:16px;font-size:.92rem}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.row small{display:block;color:var(--muted)}
.sum{font-family:var(--serif);font-weight:700;font-size:1.2rem;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.ready{background:#e3efd6;color:#40691f;border-radius:16px;padding:14px;font-weight:700;margin-top:18px}
.back{display:inline-block;margin-top:24px;font-weight:700;color:var(--caramel);text-decoration:none;font-size:.9rem}
.paybtn{display:block;margin-top:20px;background:var(--espresso);color:var(--cream);padding:15px;border-radius:999px;font-weight:800;text-decoration:none}
.paidtag{margin-top:14px;font-size:.8rem;font-weight:700;color:#40691f}.paidtag.cash{color:var(--muted)}
.bonus-tag{margin-top:12px;background:#fff3df;color:#8a5a14;border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:700;text-align:center}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper);margin-bottom:18px}
.lang button{border:none;background:none;font:inherit;font-weight:800;font-size:.72rem;padding:7px 10px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--espresso);color:var(--cream)}
.sndbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--cream);color:var(--brown);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.sndbtn.on{background:#fff3df;border-color:var(--caramel-2);color:#8a5a14}
.sndbtn.tap{background:#fde8d6;border-color:#e0a37a;color:#9a4a22;animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 6px rgba(217,85,43,.12)}}
.sndhint{font-size:.76rem;color:var(--muted);margin-top:6px}
.review{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);text-align:left}
.review h3{font-family:var(--serif);font-size:1.15rem;text-align:center}
.review .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-top:2px}
.rate{display:flex;justify-content:center;gap:4px;margin:14px 0 6px}
.rate button{background:none;border:none;color:var(--caramel-2);cursor:pointer;padding:4px;line-height:0;-webkit-tap-highlight-color:transparent}
.rate .ic{width:36px;height:36px}
.review textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);color:var(--espresso);min-height:84px;resize:vertical}
.review .note{font-size:.76rem;color:var(--muted);margin:6px 0 10px}
.review .send{width:100%;padding:14px;border-radius:999px;border:none;background:var(--espresso);color:var(--cream);font:inherit;font-weight:800;cursor:pointer}
.review .send[disabled]{opacity:.5}
.review .err{color:#9a4a22;font-weight:700;font-size:.85rem;min-height:1.2em;margin-top:6px;text-align:center}
.mine{display:flex;justify-content:center;gap:2px;color:var(--caramel-2);margin:8px 0}
.mine .ic{width:22px;height:22px}
.review blockquote{background:var(--cream);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-top:8px}
.review .reply{margin-top:10px;background:#fff3df;border-radius:12px;padding:12px 14px;font-size:.88rem}
.review .reply b{display:block;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--caramel);margin-bottom:4px}
.thanks{text-align:center;font-weight:800;color:#40691f;margin-top:10px}
</style>
</head>
<body>
<div class="card" id="card"><div class="lang"></div><a class="brand" href="/"><span data-ic="star"></span> DrinkStar</a><div id="out" data-i18n="tr.loading">Загружаем…</div></div>
<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="sound.js"></script>
<script src="/track.js"></script>
</body>
</html>
